<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="14" y1="52" x2="38" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cafeGrad" x1="26" y1="52" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="17" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Logo Mark -->
  <g filter="url(#shadow)">
    <!-- Market Leaf Wing (Left Green) -->
    <path d="M16 46C16 46 15 28 29 16C37 9 44 13 44 13C44 13 36 25 28 35C21 43.5 16 46 16 46Z" fill="url(#leafGrad)"/>
    
    <!-- Café Warmth Wing (Right Amber) -->
    <path d="M48 20C48 20 49 38 35 48C27 55 20 51 20 51C20 51 28 39 36 29C43 20.5 48 20 48 20Z" fill="url(#cafeGrad)"/>
    
    <!-- Center Vein / S-Wave (Harmonizing white glow) -->
    <path d="M22 41C27 34 33 27 41 18" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Small Leaf Bud Accent -->
    <circle cx="44" cy="13" r="2" fill="#34d399"/>
  </g>
</svg>